# Defines the services and infrastructure for your application on Render
services:
  - type: web
    name: odoo17-tailorstyle
    env: docker
    dockerfilePath: ./Dockerfile
    # The build command is optional when using Dockerfile
    buildCommand: "" 
    # CRITICAL FIX: Pass DB parameters via command line flags for both init and regular start.
    # The '>' allows the command to span multiple lines for readability.
    startCommand: >
      odoo 
      -c /etc/odoo/odoo.conf 
      --db-host=$DB_HOST 
      --db-port=$DB_PORT 
      --db-user=$DB_USER 
      --db-password=$DB_PASSWORD 
      --database=$DB_NAME 
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons 
      --init=base,web,website,tailorstyle_management,tailorstyle_website 
      --stop-after-init 
      && 
      odoo 
      -c /etc/odoo/odoo.conf 
      --db-host=$DB_HOST 
      --db-port=$DB_PORT 
      --db-user=$DB_USER 
      --db-password=$DB_PASSWORD 
      --database=$DB_NAME 
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    
    envVars:
      # These keys are now referenced directly in the startCommand
      - key: DB_HOST
        fromDatabase:
          name: odoo17-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo17-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo17-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo17-db
          property: password
      - key: DB_NAME
        value: tailor_style
      # Master password for database management and security
      - key: ADMIN_PASSWD
        generateValue: true # Render will generate a strong secret password

databases:
  # The definition for your PostgreSQL database
  - name: odoo17-db
    databaseName: tailor_style
    plan: free