services:
  - type: web
    name: odoo17-tailorstyle
    env: docker
    dockerfilePath: ./Dockerfile
    buildCommand: "" 
    startCommand: null
    
    
    envVars:
      # Database connection variables linked from the Render PostgreSQL service
      - key: DB_HOST
        fromDatabase:
          name: odoo17-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo17-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo17-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo17-db
          property: password
      - key: DB_NAME
        value: tailor_style
      # Master password for security and database administration
      - key: ADMIN_PASSWD
        generateValue: true

databases:
  - name: odoo17-db
    databaseName: tailor_style
    plan: free