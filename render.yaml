services:
  - type: web
    name: odoo17-tailorstyle
    env: docker
    dockerfilePath: ./Dockerfile
    buildCommand: "" 
    # The start command is composed of two parts:
    # 1. Initialization/Installation (--init and --stop-after-init)
    # 2. Regular startup (The second Odoo call after '&&')
    startCommand: >
      odoo 
      -c /etc/odoo/odoo.conf 
      --db-host=$DB_HOST 
      --db-port=$DB_PORT 
      --db-user=$DB_USER 
      --db-password=$DB_PASSWORD 
      --database=$DB_NAME 
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons 
      --init=base,web,website,tailorstyle_management,tailorstyle_website 
      --stop-after-init 
      && 
      odoo 
      -c /etc/odoo/odoo.conf 
      --db-host=$DB_HOST 
      --db-port=$DB_PORT 
      --db-user=$DB_USER 
      --db-password=$DB_PASSWORD 
      --database=$DB_NAME 
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    
    envVars:
      # Database connection variables linked from the Render PostgreSQL service
      - key: DB_HOST
        fromDatabase:
          name: odoo17-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo17-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo17-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo17-db
          property: password
      - key: DB_NAME
        value: tailor_style
      # Master password for security and database administration
      - key: ADMIN_PASSWD
        generateValue: true

databases:
  - name: odoo17-db
    databaseName: tailor_style
    plan: free